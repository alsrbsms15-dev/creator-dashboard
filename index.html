.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}

.seg button:hover{color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:#475569;font-weight:600;margin:12px 2px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart{width:100%;position:relative}
svg{width:100%;height:auto;display:block;overflow:visible;font-family:inherit}

.val-lbl{fill:#334155;font-size:10px;font-weight:700}

.axis{stroke:var(--axis);stroke-width:1}

const fmt = n => (n||0).toLocaleString('en-US');
function fmtAxis(v){ v=Math.round(v);
  if(Math.abs(v)>=1e6){let x=v/1e6;return (Number.isInteger(x)?x:x.toFixed(1))+'M';}
  if(Math.abs(v)>=1e4){let x=v/1e3;return (Number.isInteger(x)?x:x.toFixed(1))+'K';}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function el(t,a,h){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in(a||{}))e.setAttribute(k,a[k]);if(h!=null)e.textContent=h;return e;}
function xtick(svg,xx,geom,lb,i,n,force,ev){
  const {H,PB}=geom; const rot=n>9;
  if(!rot){ const st=Math.ceil(n/12); if(i%st!==0 && i!==n-1) return;
    svg.appendChild(el('text',{x:xx,y:H-PB+16,'text-anchor':'middle',class:'lbl'},lb)); return; }
  const every=ev||(force?1:(n>30?2:1)); if(i%every!==0 && i!==n-1) return;
  const yy=H-PB+13, fs=force?(n>30?6.8:8):(n>26?8.2:9.4);
  svg.appendChild(el('text',{x:xx,y:yy,'text-anchor':'end','font-size':fs,fill:'#a3aebe',transform:`rotate(-42 ${xx} ${yy})`},lb));
}

/* nice round axis */
function niceNum(x,round){const exp=Math.floor(Math.log10(x));const f=x/Math.pow(10,exp);let nf;
  if(round){nf=f<1.5?1:f<3?2:f<7?5:10;}else{nf=f<=1?1:f<=2?2:f<=5?5:10;}return nf*Math.pow(10,exp);}
function niceScale(max,ticks){ if(!(max>0))return{max:1,step:1,n:1};
  const range=niceNum(max,false); const step=niceNum(range/ticks,true);
  const nmax=Math.ceil(max/step)*step; return {max:nmax,step,n:Math.round(nmax/step)};}
function drawYAxis(svg,geom,max){
  const {PL,PR,PT,PB,W,H}=geom; const sc=niceScale(max,5);
  const y=v=>H-PB-(v/sc.max)*(H-PT-PB);
  for(let i=0;i<=sc.n;i++){const val=sc.step*i;const yy=y(val);
    svg.appendChild(el('line',{x1:PL,y1:yy,x2:W-PR,y2:yy,class:'gl'}));
    svg.appendChild(el('text',{x:PL-8,y:yy+3,'text-anchor':'end',class:'lbl'},fmtAxis(val)));}
  svg.appendChild(el('line',{x1:PL,y1:H-PB,x2:W-PR,y2:H-PB,class:'axis'}));
  return {y,scMax:sc.max};
}

  const allv=series.flatMap(s=>s.data).filter(v=>v!=null);

function aiBrief(game){
  const lw=weeks[weeks.length-1], pw=weeks[weeks.length-2];
  const c=lw.games[game], p=pw.games[game];
  const mv=(cur,prev)=>({cur,prev,d:cur-prev,pct:prev?(cur-prev)/prev*100:null});
  const A=mv(c.active,p.active), C=mv(c.content,p.content), V=mv(c.views,p.views);
  let topLang=null,topN=-1;
  Object.keys(c.lang||{}).forEach(l=>{const n=(c.lang[l]||{}).content||0; if(n>topN){topN=n;topLang=l;}});
  function clause(labKo,labEn,m,unitKo,useAxis){
    const label=L(labKo,labEn);
    if(m.d===0) return `${label} ${L('변화 없음','unchanged')}`;
    const val=useAxis?fmtAxis(Math.abs(m.d)):fmt(Math.abs(m.d));
    const cls=m.d>0?'up':'down';
    const dir=m.d>0?L('증가','▲'):L('감소','▼');
    const pctTxt=(m.prev===0)?(m.d>0?L(' (신규)',' (new)'):''):` (${m.d>0?'+':'−'}${Math.abs(m.pct).toFixed(0)}%)`;
    return L(`${label} <span class="${cls}">${val}${unitKo} ${dir}${pctTxt}</span>`,
             `${label} <span class="${cls}">${dir} ${val}${pctTxt}</span>`);
  }
  const head=L(`지난 주 콘텐츠 <b>${fmt(c.content)}</b>건 · 뷰어십 <b>${fmt(c.views)}</b> · 활동 크리에이터 <b>${fmt(c.active)}</b>명`,
               `Last week: <b>${fmt(c.content)}</b> content · <b>${fmt(c.views)}</b> views · <b>${fmt(c.active)}</b> active creators`);
  const wow=L('전주 대비 ','WoW: ')+[clause('콘텐츠','Content',C,'건',false),clause('뷰어십','Viewership',V,'',false),clause('활동 크리에이터','Active creators',A,'명',false)].join(', ')+'.';
  let hl='';
  if(topLang && topN>0) hl=L(` 이번 주 콘텐츠는 <span class="ab-hl">${LN(topLang)}</span>권이 가장 활발했습니다(${fmt(topN)}건).`,
                             ` <span class="ab-hl">${LN(topLang)}</span> led content this week (${fmt(topN)}).`);
  return head+'<br>'+wow+hl;
}

  const lbox=document.createElement('div');lbox.className='chart';cL.appendChild(lbox);
  cL.appendChild(legend(langsPresent.map(l=>({name:LN(l),color:LHEX[l]||'#94a3b8'}))));
  function drawLang(){cLt.textContent=`${GN(game)} - `+L(`언어별 ${METRICS[lmetric]} · ${lastMonth.ym.slice(2)} (당월)`,`${METRICS[lmetric]} by Language · ${lastMonth.ym.slice(2)} (current)`);lbox.innerHTML='';
    const groups=langsPresent.map(l=>({label:LN(l),color:LHEX[l]||'#94a3b8',values:[ (lastMonth.games[game].lang[l]||{})[lmetric]||0 ]}));
    lbox.appendChild(groupedBar(groups,[METRICS[lmetric]],langsPresent.map(l=>LHEX[l]||'#94a3b8'),{showValues:true,h:300}));}
  drawLang();
  viewEl.appendChild(cL);

  const cLT=card(GN(game)+' - '+L('언어별 월간 콘텐츠 수 추이','Monthly Content by Language'),L('언어별 누적(스택) · 상단 수치=월 합계 · *최신월 진행 중','Stacked by language · top number = month total · *current in progress'));
  const cLTt=cLT.querySelector('h3');
  let ltmetric='content';
  cLT.appendChild(seg([{label:L('콘텐츠 수','Content'),val:'content'},{label:L('뷰어십','Viewership'),val:'views'}],ltmetric,v=>{ltmetric=v;drawLangTrend();}));
  cLT.appendChild(legend(langsPresent.map(l=>({name:LN(l),color:LHEX[l]||'#94a3b8'}))));
  const ltbox=document.createElement('div');ltbox.className='chart';cLT.appendChild(ltbox);
  function drawLangTrend(){cLTt.textContent=`${GN(game)} - `+L(`언어별 월간 ${METRICS[ltmetric]} 추이`,`Monthly ${METRICS[ltmetric]} by Language`);ltbox.innerHTML='';
    const labs=months.map(mlab);
    const stacks=months.map(m=>{const o={};langsPresent.forEach(l=>o[l]=(m.games[game].lang[l]||{})[ltmetric]||0);return o;});
    ltbox.appendChild(stackedBar(labs,stacks,langsPresent,LHEX,{showValues:true,xticks:months.length,h:300,nameMap:LN}));}
  drawLangTrend();
  viewEl.appendChild(cLT);

  // 지난 주 조회수 TOP5 콘텐츠
  const t5=(DATA.top5&&DATA.top5[game])||[];
  const cT5=card(GN(game)+' - '+L('지난 주 조회수 TOP 5 콘텐츠','Top 5 Content by Views · Last Week'),
    L('지난 주('+(DATA.top5_week||'')+') 업로드 콘텐츠 · 조회수 순 · 제목 클릭 시 원본으로 이동','Last week ('+(DATA.top5_week||'')+') uploads · ranked by views · click a title to open'));
  if(!t5.length){ const e=document.createElement('div');e.className='note';e.textContent=L('해당 주 데이터가 없습니다.','No data for this week.');cT5.appendChild(e); }
  else {
    let h='<table class="t5tbl"><thead><tr><th>#</th><th>'+L('콘텐츠','Content')+'</th><th>'+L('크리에이터','Creator')+'</th><th>'+L('언어','Language')+'</th><th>'+L('조회수','Views')+'</th></tr></thead><tbody>';
    t5.forEach((r,i)=>{
      const title=esc(r.title)||L('(제목 없음)','(no title)');
      const cell = r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${title}</a>` : title;
      const col=LHEX[r.lang]||'#64748b';
      h+=`<tr><td class="rk">${i+1}</td><td class="tt">${cell}</td><td>${esc(r.channel)}</td><td><span class="lchip" style="background:${col}1f;color:${col}">${LN(r.lang)}</span></td><td class="vw">${fmt(r.views)}</td></tr>`;
    });
    h+='</tbody></table>';
    const dv=document.createElement('div');dv.style.overflowX='auto';dv.innerHTML=h;cT5.appendChild(dv);
  }
  viewEl.appendChild(cT5);

  // 지난 주 언어별 콘텐츠 최다 제작 크리에이터 TOP5
  const tc=(DATA.topcreators&&DATA.topcreators[game])||{};
  const cTC=card(GN(game)+' - '+L('언어별 콘텐츠 최다 제작 크리에이터 TOP 5','Top 5 Most Active Creators by Language · Last Week'),
    L('지난 주('+(DATA.top5_week||'')+') 기준 · 언어별 콘텐츠 수(제작량) 순 · 해당 콘텐츠들의 뷰어십 합 포함','Last week ('+(DATA.top5_week||'')+') · per language, ranked by content volume · with total viewership'));
  const TCL=['한국어','영어','일본어','중국어(번체)'];
  const present=TCL.filter(l=>(tc[l]||[]).length);
  if(!present.length){ const e=document.createElement('div');e.className='note';e.textContent=L('해당 주 데이터가 없습니다.','No data for this week.');cTC.appendChild(e); }
  else {
    const grid=document.createElement('div');grid.className='tcgrid';
    present.forEach(l=>{
      const box=document.createElement('div');const col=LHEX[l]||'#64748b';
      let h=`<div style="margin:4px 0 8px"><span class="lchip" style="background:${col}1f;color:${col};font-size:12px;padding:3px 11px">${LN(l)}</span></div>`;
      h+='<table class="t5tbl"><thead><tr><th>#</th><th>'+L('크리에이터','Creator')+'</th><th>'+L('콘텐츠 수','Contents')+'</th><th>'+L('뷰어십 합','Total Views')+'</th></tr></thead><tbody>';
      (tc[l]||[]).forEach((r,i)=>{ h+=`<tr${i<3?' class="top3"':''}><td class="rk${i<3?' r'+(i+1):''}">${i+1}</td><td class="tt">${esc(r.channel)}</td><td class="vw">${fmt(r.count)}</td><td class="vw">${fmt(r.views)}</td></tr>`; });
      h+='</tbody></table>';
      box.innerHTML=h;grid.appendChild(box);
    });
    cTC.appendChild(grid);
  }
  viewEl.appendChild(cTC);
}

function setFooter(){
  document.getElementById('footer').innerHTML = LANG==='en'
  ? `<b>Metric Definitions</b><br>`+
    `· <b>Total Creators</b>: Registered roster from the latest weekly report's Basic Info sheet.<br>`+
    `· <b>Active Creators</b>: Based on 'weekly active creators' in each game sheet = unique creators who posted at least one content in the period (summed by language, excluding official/ops channels). Weekly matches the sheet exactly; monthly uses the same definition.<br>`+
    `· <b>Content / Viewership</b>: All content on owned partner channels (same basis as the Basic Info sheet). Weekly=per file, daily/monthly=by upload date.<br>`+
    `· <b>Lord Nine regions</b>: KR/TW=Korean·Chinese(Trad.), Asia=English·Japanese·Thai (same as Basic Info sheet regions).<br>`+
    `· Data range ${DATA.coverage.first} ~ ${DATA.coverage.last} · regenerated when a new weekly file is added.`
  : `<b>지표 정의</b><br>`+
    `· <b>전체 크리에이터 수</b>: 최신 주간 리포트 기본정보 시트의 등록 로스터.<br>`+
    `· <b>활동 크리에이터</b>: 게임별 정리 시트의 '주간 활동 크리에이터' 기준 = 해당 기간 콘텐츠를 1건 이상 게시한 고유 크리에이터(언어별 집계 후 합산, 공식/운영 채널 제외). 주간=시트값과 정확히 일치, 월간=동일 정의로 산출.<br>`+
    `· <b>콘텐츠 수 / 뷰어십</b>: 자사 파트너 채널 콘텐츠 전체 (기본정보 시트와 동일 기준). 주간=파일 단위, 일간/월간=업로드 일자 기준.<br>`+
    `· <b>로드나인 권역</b>: 한/대만=한국어·중국어(번체), 아시아=영어·일본어·태국어 (기본정보 시트 권역 구분과 동일).<br>`+
    `· 데이터 범위 ${DATA.coverage.first} ~ ${DATA.coverage.last} · 새 주차 파일 추가 시 재생성.`;
}

function applyLang(lang){
  LANG=lang;
  try{localStorage.setItem('dash_lang',lang);}catch(e){}
  document.documentElement.lang=lang;
  applyLangConsts();
  [...document.getElementById('langtoggle').children].forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  setHeader(); buildTabs(); setFooter(); render();
}
[...document.getElementById('langtoggle').children].forEach(b=>{
  b.onclick=()=>applyLang(b.dataset.l);
});

applyLang(LANG);
</script>
</body>
</html>
